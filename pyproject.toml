[project]
name = "multi-domain-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-domain-chat = "multi_domain_chat:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
